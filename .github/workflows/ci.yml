name: CI

on:
  pull_request:
  push:
    branches:
      - 'feature/**'
      - 'integration/**'
      - 'hardening/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      NODE_ENV: test
      SERVICE_PRINCIPALS_FILE: test/fixtures-service-principals.json
      EIN_FINGERPRINT_PEPPER: test-only-pepper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install exact dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
