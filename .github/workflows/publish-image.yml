name: Publish immutable release image

on:
  push:
    branches:
      - 'release/**'
    tags:
      - 'scrapper-v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish by immutable digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/scrapper:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/scrapper
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Record immutable release identity
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/scrapper
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p release-evidence
          jq -n \
            --arg source_sha "${GITHUB_SHA}" \
            --arg image "${IMAGE_NAME}@${IMAGE_DIGEST}" \
            --arg digest "${IMAGE_DIGEST}" \
            --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{source_sha:$source_sha,image:$image,digest:$digest,run_url:$run_url}' \
            > release-evidence/image.json
          printf '%s@%s\n' "${IMAGE_NAME}" "${IMAGE_DIGEST}" > release-evidence/image-ref.txt

      - uses: actions/upload-artifact@v4
        with:
          name: immutable-image-${{ github.sha }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 30
