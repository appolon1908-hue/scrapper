name: Production deployment

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact current SHA of the protected release branch
        required: true
        type: string
      image_digest:
        description: Published immutable candidate sha256 image digest
        required: true
        type: string
      previous_image_ref:
        description: Currently deployed previously approved immutable image reference
        required: true
        type: string
      runtime_root:
        description: Existing verified production runtime root
        required: true
        type: string
      runtime_env_file:
        description: Existing externally managed production environment file
        required: true
        type: string
      runtime_secrets_root:
        description: Existing production secrets directory
        required: true
        type: string
      runtime_fingerprint:
        description: SHA-256 fingerprint from Runtime path inventory
        required: true
        type: string
      expected_api_port:
        description: Expected loopback API port
        required: true
        default: '3200'
        type: string
      approval:
        description: Enter DEPLOY-PRODUCTION <release_sha> <image_digest> <previous_image_ref> <runtime_fingerprint>
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/appolon1908-hue/scrapper
  RELEASE_BRANCH: release/production-readiness-20260826

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify_artifact:
    name: verify-artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
      attestations: read
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      IMAGE_DIGEST: ${{ inputs.image_digest }}
      PREVIOUS_IMAGE_REF: ${{ inputs.previous_image_ref }}
      RUNTIME_FINGERPRINT: ${{ inputs.runtime_fingerprint }}
      APPROVAL: ${{ inputs.approval }}
    outputs:
      image: ${{ steps.validate.outputs.image }}
      previous_image: ${{ steps.validate.outputs.previous_image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate digest-bound approval
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$PREVIOUS_IMAGE_REF" =~ ^ghcr\.io/appolon1908-hue/scrapper@sha256:[a-f0-9]{64}$ ]]
          [[ "$RUNTIME_FINGERPRINT" =~ ^[a-f0-9]{64}$ ]]
          image="$IMAGE_NAME@$IMAGE_DIGEST"
          [[ "$image" != "$PREVIOUS_IMAGE_REF" ]]
          [[ "$APPROVAL" == "DEPLOY-PRODUCTION $RELEASE_SHA $IMAGE_DIGEST $PREVIOUS_IMAGE_REF $RUNTIME_FINGERPRINT" ]]
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "previous_image=$PREVIOUS_IMAGE_REF" >> "$GITHUB_OUTPUT"

      - name: Require exact protected release head and exact-SHA checks
        shell: bash
        run: bash scripts/verify-release-context.sh

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Verify candidate signature provenance and exact revision
        env:
          IMAGE_REF: ${{ steps.validate.outputs.image }}
          IMAGE_RELATIONSHIP: exact
        shell: bash
        run: bash scripts/verify-release-image.sh "$IMAGE_REF" "$IMAGE_RELATIONSHIP"

      - name: Verify rollback signature provenance and release ancestry
        env:
          IMAGE_REF: ${{ steps.validate.outputs.previous_image }}
          IMAGE_RELATIONSHIP: ancestor
        shell: bash
        run: bash scripts/verify-release-image.sh "$IMAGE_REF" "$IMAGE_RELATIONSHIP"

  runtime_preflight:
    name: runtime-preflight
    needs: verify_artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production-runtime-audit
    env:
      RUNTIME_HOST: ${{ secrets.RUNTIME_AUDIT_HOST }}
      RUNTIME_USER: ${{ secrets.RUNTIME_AUDIT_USER }}
      RUNTIME_SSH_KEY: ${{ secrets.RUNTIME_AUDIT_SSH_KEY }}
      RUNTIME_KNOWN_HOSTS: ${{ secrets.RUNTIME_AUDIT_KNOWN_HOSTS }}
      RUNTIME_SSH_PORT: ${{ vars.RUNTIME_AUDIT_SSH_PORT || '22' }}
      RUNTIME_ROOT: ${{ inputs.runtime_root }}
      RUNTIME_ENV_FILE: ${{ inputs.runtime_env_file }}
      RUNTIME_SECRETS_ROOT: ${{ inputs.runtime_secrets_root }}
      RUNTIME_FINGERPRINT: ${{ inputs.runtime_fingerprint }}
      EXPECTED_API_PORT: ${{ inputs.expected_api_port }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Configure read-only SSH identity and pinned host keys
        shell: bash
        run: |
          set -euo pipefail
          for value in RUNTIME_HOST RUNTIME_USER RUNTIME_SSH_KEY RUNTIME_KNOWN_HOSTS; do
            [[ -n "${!value:-}" ]] || { echo "ERROR=MISSING_${value}" >&2; exit 1; }
          done
          [[ "$RUNTIME_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$RUNTIME_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$RUNTIME_SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          for path in "$RUNTIME_ROOT" "$RUNTIME_ENV_FILE" "$RUNTIME_SECRETS_ROOT"; do
            [[ "$path" =~ ^/[A-Za-z0-9._/-]+$ ]]
            [[ "$path" != "/" && "$path" != *"//"* && "$path" != *"/../"* &&
               "$path" != *"/./"* && "$path" != */.. && "$path" != */. ]]
          done
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$RUNTIME_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$RUNTIME_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Verify reviewed runtime fingerprint without changing the server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence
          ssh_options=(-i "$HOME/.ssh/id_ed25519" -p "$RUNTIME_SSH_PORT" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          ssh "${ssh_options[@]}" "$RUNTIME_USER@$RUNTIME_HOST" bash -s -- \
            "$RUNTIME_ROOT" "$RUNTIME_ENV_FILE" "$RUNTIME_SECRETS_ROOT" "$EXPECTED_API_PORT" \
            < scripts/runtime-path-inventory.sh | tee runtime-evidence/preflight-observation.txt
          awk '/^BEGIN_CONTRACT$/ {capture=1; next} /^END_CONTRACT$/ {capture=0} capture {print}' \
            runtime-evidence/preflight-observation.txt | LC_ALL=C sort > runtime-evidence/preflight-contract.txt
          actual="$(sha256sum runtime-evidence/preflight-contract.txt | awk '{print $1}')"
          [[ "$actual" == "$RUNTIME_FINGERPRINT" ]]
          grep -qx 'ready_for_write_disabled_deploy=true' runtime-evidence/preflight-contract.txt
          printf '%s\n' "$actual" > runtime-evidence/verified-fingerprint.txt
          printf '%s\n' 'server_modified=false' > runtime-evidence/preflight-result.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-runtime-preflight-${{ inputs.runtime_fingerprint }}
          path: runtime-evidence/
          if-no-files-found: error
          retention-days: 90

  deploy:
    name: deploy
    needs: [verify_artifact, runtime_preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    env:
      PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
      PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
      PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
      PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
      PRODUCTION_SSH_PORT: ${{ vars.PRODUCTION_SSH_PORT || '22' }}
      PRODUCTION_GHCR_USER: ${{ secrets.PRODUCTION_GHCR_USER }}
      PRODUCTION_GHCR_READ_TOKEN: ${{ secrets.PRODUCTION_GHCR_READ_TOKEN }}
      PRODUCTION_API_BASE: ${{ vars.PRODUCTION_API_BASE }}
      PRODUCTION_CANARY_TOKEN: ${{ secrets.PRODUCTION_CANARY_TOKEN }}
      PRODUCTION_CANARY_TENANT_ID: ${{ secrets.PRODUCTION_CANARY_TENANT_ID }}
      PRODUCTION_CANARY_SEED_URL: ${{ vars.PRODUCTION_CANARY_SEED_URL || 'https://example.com' }}
      RUNTIME_ROOT: ${{ inputs.runtime_root }}
      RUNTIME_ENV_FILE: ${{ inputs.runtime_env_file }}
      RUNTIME_SECRETS_ROOT: ${{ inputs.runtime_secrets_root }}
      RUNTIME_FINGERPRINT: ${{ inputs.runtime_fingerprint }}
      EXPECTED_API_PORT: ${{ inputs.expected_api_port }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      IMAGE: ${{ needs.verify_artifact.outputs.image }}
      PREVIOUS_IMAGE_REF: ${{ needs.verify_artifact.outputs.previous_image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'

      - name: Validate production credentials and paths
        shell: bash
        run: |
          set -euo pipefail
          for value in PRODUCTION_HOST PRODUCTION_USER PRODUCTION_SSH_KEY PRODUCTION_KNOWN_HOSTS PRODUCTION_GHCR_USER PRODUCTION_GHCR_READ_TOKEN PRODUCTION_API_BASE PRODUCTION_CANARY_TOKEN PRODUCTION_CANARY_TENANT_ID; do
            [[ -n "${!value:-}" ]] || { echo "ERROR=MISSING_${value}" >&2; exit 1; }
          done
          [[ "$PRODUCTION_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$PRODUCTION_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$PRODUCTION_GHCR_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$PRODUCTION_SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          for path in "$RUNTIME_ROOT" "$RUNTIME_ENV_FILE" "$RUNTIME_SECRETS_ROOT"; do
            [[ "$path" =~ ^/[A-Za-z0-9._/-]+$ ]]
            [[ "$path" != "/" && "$path" != *"//"* && "$path" != *"/../"* &&
               "$path" != *"/./"* && "$path" != */.. && "$path" != */. ]]
          done

      - name: Configure deployment SSH identity and pinned host keys
        shell: bash
        run: |
          set -euo pipefail
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$PRODUCTION_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Reverify fingerprint before the first production write
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(-i "$HOME/.ssh/id_ed25519" -p "$PRODUCTION_SSH_PORT" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          ssh "${ssh_options[@]}" "$PRODUCTION_USER@$PRODUCTION_HOST" bash -s -- \
            "$RUNTIME_ROOT" "$RUNTIME_ENV_FILE" "$RUNTIME_SECRETS_ROOT" "$EXPECTED_API_PORT" \
            < scripts/runtime-path-inventory.sh > runtime-before-production.txt
          awk '/^BEGIN_CONTRACT$/ {capture=1; next} /^END_CONTRACT$/ {capture=0} capture {print}' \
            runtime-before-production.txt | LC_ALL=C sort > runtime-before-production.contract
          actual="$(sha256sum runtime-before-production.contract | awk '{print $1}')"
          [[ "$actual" == "$RUNTIME_FINGERPRINT" ]]
          grep -qx 'ready_for_write_disabled_deploy=true' runtime-before-production.contract

      - name: Upload reviewed production package and rollback helpers
        shell: bash
        run: |
          set -euo pipefail
          archive="/tmp/scrapper-production-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tgz"
          deploy_helper="/tmp/scrapper-deploy-production-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          rollback_helper="/tmp/scrapper-rollback-production-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          tar -czf "$archive" docker-compose.yml scripts/deploy-production.sh scripts/rollback-production.sh
          sha256sum "$archive" > "$archive.sha256"
          scp_options=(-i "$HOME/.ssh/id_ed25519" -P "$PRODUCTION_SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          scp "${scp_options[@]}" "$archive" "$archive.sha256" "$PRODUCTION_USER@$PRODUCTION_HOST:/tmp/"
          scp "${scp_options[@]}" scripts/deploy-production.sh "$PRODUCTION_USER@$PRODUCTION_HOST:$deploy_helper"
          scp "${scp_options[@]}" scripts/rollback-production.sh "$PRODUCTION_USER@$PRODUCTION_HOST:$rollback_helper"

      - name: Deploy approved candidate with run-scoped registry credentials
        id: deploy_candidate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          archive="/tmp/scrapper-production-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tgz"
          deploy_helper="/tmp/scrapper-deploy-production-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          docker_config="/tmp/scrapper-docker-auth-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-candidate"
          ssh_options=(-i "$HOME/.ssh/id_ed25519" -p "$PRODUCTION_SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          printf '%s' "$PRODUCTION_GHCR_READ_TOKEN" | ssh "${ssh_options[@]}" "$PRODUCTION_USER@$PRODUCTION_HOST" \
            "set -euo pipefail; docker_config='$docker_config'; cleanup(){ DOCKER_CONFIG=\"\$docker_config\" docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf \"\$docker_config\"; }; trap cleanup EXIT; install -d -m 0700 \"\$docker_config\"; DOCKER_CONFIG=\"\$docker_config\" docker login ghcr.io -u '$PRODUCTION_GHCR_USER' --password-stdin >/dev/null; export DOCKER_CONFIG=\"\$docker_config\"; RUNTIME_ROOT='$RUNTIME_ROOT' DEPLOY_ENV_FILE='$RUNTIME_ENV_FILE' RUNTIME_SECRETS_ROOT='$RUNTIME_SECRETS_ROOT' EXPECTED_API_PORT='$EXPECTED_API_PORT' RELEASE_SHA='$RELEASE_SHA' CANDIDATE_SCRAPPER_IMAGE='$IMAGE' PREVIOUS_SCRAPPER_IMAGE='$PREVIOUS_IMAGE_REF' PACKAGE_ARCHIVE='$archive' bash '$deploy_helper'"

      - name: Run production no-write canary
        id: production_canary
        if: steps.deploy_candidate.outcome == 'success'
        continue-on-error: true
        env:
          CANARY_TOKEN: ${{ secrets.PRODUCTION_CANARY_TOKEN }}
          CANARY_TENANT_ID: ${{ secrets.PRODUCTION_CANARY_TENANT_ID }}
          CANARY_API_BASE: ${{ vars.PRODUCTION_API_BASE }}
          CANARY_SEED_URL: ${{ vars.PRODUCTION_CANARY_SEED_URL || 'https://example.com' }}
        shell: bash
        run: |
          mkdir -p production-evidence
          RELEASE_SHA="$RELEASE_SHA" node scripts/no-write-canary.mjs | tee production-evidence/no-write-canary.json

      - name: Restore verified previous image after deployment or canary failure
        id: rollback_on_failure
        if: always() && (steps.deploy_candidate.outcome != 'success' || steps.production_canary.outcome != 'success')
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rollback_helper="/tmp/scrapper-rollback-production-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          docker_config="/tmp/scrapper-docker-auth-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-rollback"
          ssh_options=(-i "$HOME/.ssh/id_ed25519" -p "$PRODUCTION_SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          printf '%s' "$PRODUCTION_GHCR_READ_TOKEN" | ssh "${ssh_options[@]}" "$PRODUCTION_USER@$PRODUCTION_HOST" \
            "set -euo pipefail; docker_config='$docker_config'; cleanup(){ DOCKER_CONFIG=\"\$docker_config\" docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf \"\$docker_config\"; }; trap cleanup EXIT; install -d -m 0700 \"\$docker_config\"; DOCKER_CONFIG=\"\$docker_config\" docker login ghcr.io -u '$PRODUCTION_GHCR_USER' --password-stdin >/dev/null; export DOCKER_CONFIG=\"\$docker_config\"; RUNTIME_ROOT='$RUNTIME_ROOT' DEPLOY_ENV_FILE='$RUNTIME_ENV_FILE' EXPECTED_API_PORT='$EXPECTED_API_PORT' RELEASE_SHA='$RELEASE_SHA' PREVIOUS_SCRAPPER_IMAGE='$PREVIOUS_IMAGE_REF' EVIDENCE_DIR='$RUNTIME_ROOT/releases/$RELEASE_SHA/release-evidence/canary-failure-rollback' bash '$rollback_helper'"
          mkdir -p production-evidence
          printf '%s\n' 'database_restore_performed=false' > production-evidence/automatic-rollback.txt
          printf '%s\n' 'application_image_restored=true' >> production-evidence/automatic-rollback.txt

      - name: Record successful production identity only after canary passes
        if: steps.deploy_candidate.outcome == 'success' && steps.production_canary.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(-i "$HOME/.ssh/id_ed25519" -p "$PRODUCTION_SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          ssh "${ssh_options[@]}" "$PRODUCTION_USER@$PRODUCTION_HOST" \
            "printf '%s\n' '$PREVIOUS_IMAGE_REF' > '$RUNTIME_ROOT/.previous_image'; printf '%s\n' '$IMAGE' > '$RUNTIME_ROOT/.current_image'; printf '%s\n' '$RELEASE_SHA' > '$RUNTIME_ROOT/.current_release'"
          mkdir -p production-evidence
          cat > production-evidence/production-deployment.json <<EOF
          {
            "release_sha": "$RELEASE_SHA",
            "image": "$IMAGE",
            "previous_image": "$PREVIOUS_IMAGE_REF",
            "approved_by": "$GITHUB_ACTOR",
            "runtime_fingerprint": "$RUNTIME_FINGERPRINT",
            "external_delivery_enabled": false,
            "registry_enrichment_enabled": false,
            "deployed": true
          }
          EOF

      - name: Collect evidence and remove temporary files
        if: always()
        shell: bash
        run: |
          archive="/tmp/scrapper-production-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tgz"
          deploy_helper="/tmp/scrapper-deploy-production-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          rollback_helper="/tmp/scrapper-rollback-production-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          ssh_options=(-i "$HOME/.ssh/id_ed25519" -p "$PRODUCTION_SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          scp_options=(-i "$HOME/.ssh/id_ed25519" -P "$PRODUCTION_SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          remote_evidence="/tmp/scrapper-production-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tgz"
          ssh "${ssh_options[@]}" "$PRODUCTION_USER@$PRODUCTION_HOST" \
            "if [[ -d '$RUNTIME_ROOT/releases/$RELEASE_SHA/release-evidence' ]]; then cd '$RUNTIME_ROOT/releases/$RELEASE_SHA' && tar -czf '$remote_evidence' release-evidence; fi; find /tmp -maxdepth 1 -type d -name 'scrapper-docker-auth-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-*' -exec rm -rf -- {} +; rm -f '$archive' '$archive.sha256' '$deploy_helper' '$rollback_helper'" || true
          scp "${scp_options[@]}" "$PRODUCTION_USER@$PRODUCTION_HOST:$remote_evidence" ./ || true
          ssh "${ssh_options[@]}" "$PRODUCTION_USER@$PRODUCTION_HOST" "rm -f '$remote_evidence'" || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: production-deployment-evidence-${{ inputs.release_sha }}
          path: |
            production-evidence/
            scrapper-production-evidence-*.tgz
            runtime-before-production.txt
            runtime-before-production.contract
          if-no-files-found: warn
          retention-days: 90

      - name: fail-after-rollback
        if: always() && (steps.deploy_candidate.outcome != 'success' || steps.production_canary.outcome != 'success')
        shell: bash
        run: |
          if [[ "${{ steps.rollback_on_failure.outcome }}" == "success" ]]; then
            echo 'The candidate failed; the verified previous application image was restored. No database restore was performed.' >&2
          else
            echo 'The candidate failed and automatic application rollback did not complete successfully.' >&2
          fi
          exit 1
