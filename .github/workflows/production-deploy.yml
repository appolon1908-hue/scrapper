name: Production deployment

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Reviewed 40-character commit SHA from the protected release branch
        required: true
        type: string
      image_digest:
        description: Published immutable sha256 image digest
        required: true
        type: string
      runtime_root:
        description: Existing verified production runtime root
        required: true
        type: string
      runtime_env_file:
        description: Existing externally managed production environment file
        required: true
        type: string
      runtime_secrets_root:
        description: Existing production secrets directory
        required: true
        type: string
      runtime_fingerprint:
        description: SHA-256 fingerprint from Runtime path inventory
        required: true
        type: string
      expected_api_port:
        description: Expected loopback API port
        required: true
        default: '3200'
        type: string
      approval:
        description: Enter DEPLOY-PRODUCTION <release_sha> <image_digest> <runtime_fingerprint>
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/appolon1908-hue/scrapper
  RELEASE_BRANCH: release/production-readiness-20260826

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify-artifact:
    name: verify-artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      IMAGE_DIGEST: ${{ inputs.image_digest }}
      RUNTIME_FINGERPRINT: ${{ inputs.runtime_fingerprint }}
      APPROVAL: ${{ inputs.approval }}
    outputs:
      image: ${{ steps.validate.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Validate digest-bound approval and protected release SHA
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$RUNTIME_FINGERPRINT" =~ ^[a-f0-9]{64}$ ]]
          [[ "$APPROVAL" == "DEPLOY-PRODUCTION $RELEASE_SHA $IMAGE_DIGEST $RUNTIME_FINGERPRINT" ]]
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
          encoded_branch="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["RELEASE_BRANCH"], safe=""))')"
          branch_json="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${encoded_branch}")"
          [[ "$(jq -r '.protected' <<<"$branch_json")" == "true" ]]
          branch_sha="$(jq -r '.commit.sha' <<<"$branch_json")"
          git fetch --no-tags origin "refs/heads/$RELEASE_BRANCH:refs/remotes/origin/release-candidate"
          git merge-base --is-ancestor "$RELEASE_SHA" "$branch_sha"
          echo "image=$IMAGE_NAME@$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Verify image revision signature and GitHub attestation
        env:
          IMAGE: ${{ steps.validate.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          revision="$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          [[ "$revision" == "$RELEASE_SHA" ]]
          cosign verify \
            --certificate-identity-regexp "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-readiness.yml@.*" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$IMAGE" >/dev/null
          gh attestation verify "oci://$IMAGE" --repo "$GITHUB_REPOSITORY"

  runtime-preflight:
    name: runtime-preflight
    needs: verify-artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production-runtime-audit
    env:
      RUNTIME_HOST: ${{ secrets.RUNTIME_AUDIT_HOST }}
      RUNTIME_USER: ${{ secrets.RUNTIME_AUDIT_USER }}
      RUNTIME_SSH_KEY: ${{ secrets.RUNTIME_AUDIT_SSH_KEY }}
      RUNTIME_KNOWN_HOSTS: ${{ secrets.RUNTIME_AUDIT_KNOWN_HOSTS }}
      RUNTIME_SSH_PORT: ${{ vars.RUNTIME_AUDIT_SSH_PORT || '22' }}
      RUNTIME_ROOT: ${{ inputs.runtime_root }}
      RUNTIME_ENV_FILE: ${{ inputs.runtime_env_file }}
      RUNTIME_SECRETS_ROOT: ${{ inputs.runtime_secrets_root }}
      RUNTIME_FINGERPRINT: ${{ inputs.runtime_fingerprint }}
      EXPECTED_API_PORT: ${{ inputs.expected_api_port }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_sha }}

      - name: Configure read-only SSH identity and pinned host keys
        shell: bash
        run: |
          set -euo pipefail
          for value in RUNTIME_HOST RUNTIME_USER RUNTIME_SSH_KEY RUNTIME_KNOWN_HOSTS; do
            [[ -n "${!value:-}" ]] || { echo "ERROR=MISSING_${value}" >&2; exit 1; }
          done
          [[ "$RUNTIME_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$RUNTIME_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$RUNTIME_SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          (( RUNTIME_SSH_PORT >= 1 && RUNTIME_SSH_PORT <= 65535 ))
          for path in "$RUNTIME_ROOT" "$RUNTIME_ENV_FILE" "$RUNTIME_SECRETS_ROOT"; do
            [[ "$path" =~ ^/[A-Za-z0-9._/-]+$ ]]
            [[ "$path" != "/" && "$path" != *"//"* && "$path" != *"/../"* && "$path" != *"/./"* ]]
          done
          [[ "$EXPECTED_API_PORT" =~ ^[0-9]{1,5}$ ]]
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$RUNTIME_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$RUNTIME_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Verify reviewed runtime fingerprint without changing the server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence
          ssh_options=(
            -i "$HOME/.ssh/id_ed25519"
            -p "$RUNTIME_SSH_PORT"
            -o BatchMode=yes
            -o ConnectTimeout=10
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          ssh "${ssh_options[@]}" "$RUNTIME_USER@$RUNTIME_HOST" bash -s -- \
            "$RUNTIME_ROOT" "$RUNTIME_ENV_FILE" "$RUNTIME_SECRETS_ROOT" "$EXPECTED_API_PORT" \
            < scripts/runtime-path-inventory.sh \
            | tee runtime-evidence/preflight-observation.txt
          awk '
            /^BEGIN_CONTRACT$/ { capture=1; next }
            /^END_CONTRACT$/ { capture=0 }
            capture { print }
          ' runtime-evidence/preflight-observation.txt \
            | LC_ALL=C sort > runtime-evidence/preflight-contract.txt
          actual="$(sha256sum runtime-evidence/preflight-contract.txt | awk '{print $1}')"
          [[ "$actual" == "$RUNTIME_FINGERPRINT" ]]
          grep -qx 'ready_for_write_disabled_deploy=true' runtime-evidence/preflight-contract.txt
          printf '%s\n' "$actual" > runtime-evidence/verified-fingerprint.txt
          printf '%s\n' 'server_modified=false' > runtime-evidence/preflight-result.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-runtime-preflight-${{ inputs.runtime_fingerprint }}
          path: runtime-evidence/
          if-no-files-found: error
          retention-days: 90

  deploy:
    name: deploy
    needs: [verify-artifact, runtime-preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: production
    env:
      PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
      PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
      PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
      PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
      PRODUCTION_SSH_PORT: ${{ vars.PRODUCTION_SSH_PORT || '22' }}
      PRODUCTION_GHCR_USER: ${{ secrets.PRODUCTION_GHCR_USER }}
      PRODUCTION_GHCR_READ_TOKEN: ${{ secrets.PRODUCTION_GHCR_READ_TOKEN }}
      PRODUCTION_API_BASE: ${{ vars.PRODUCTION_API_BASE }}
      PRODUCTION_CANARY_TOKEN: ${{ secrets.PRODUCTION_CANARY_TOKEN }}
      PRODUCTION_CANARY_TENANT_ID: ${{ secrets.PRODUCTION_CANARY_TENANT_ID }}
      PRODUCTION_CANARY_SEED_URL: ${{ vars.PRODUCTION_CANARY_SEED_URL || 'https://example.com' }}
      RUNTIME_ROOT: ${{ inputs.runtime_root }}
      RUNTIME_ENV_FILE: ${{ inputs.runtime_env_file }}
      RUNTIME_SECRETS_ROOT: ${{ inputs.runtime_secrets_root }}
      RUNTIME_FINGERPRINT: ${{ inputs.runtime_fingerprint }}
      EXPECTED_API_PORT: ${{ inputs.expected_api_port }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      IMAGE: ${{ needs.verify-artifact.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'

      - name: Validate production credentials and explicit paths
        shell: bash
        run: |
          set -euo pipefail
          for value in PRODUCTION_HOST PRODUCTION_USER PRODUCTION_SSH_KEY PRODUCTION_KNOWN_HOSTS PRODUCTION_GHCR_USER PRODUCTION_GHCR_READ_TOKEN PRODUCTION_API_BASE PRODUCTION_CANARY_TOKEN PRODUCTION_CANARY_TENANT_ID; do
            [[ -n "${!value:-}" ]] || { echo "ERROR=MISSING_${value}" >&2; exit 1; }
          done
          [[ "$PRODUCTION_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$PRODUCTION_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$PRODUCTION_GHCR_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$PRODUCTION_SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          for path in "$RUNTIME_ROOT" "$RUNTIME_ENV_FILE" "$RUNTIME_SECRETS_ROOT"; do
            [[ "$path" =~ ^/[A-Za-z0-9._/-]+$ ]]
            [[ "$path" != "/" && "$path" != *"//"* && "$path" != *"/../"* && "$path" != *"/./"* ]]
          done

      - name: Configure deployment SSH identity and pinned host keys
        shell: bash
        run: |
          set -euo pipefail
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$PRODUCTION_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Reverify fingerprint before the first production write
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(
            -i "$HOME/.ssh/id_ed25519"
            -p "$PRODUCTION_SSH_PORT"
            -o BatchMode=yes
            -o ConnectTimeout=10
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          ssh "${ssh_options[@]}" "$PRODUCTION_USER@$PRODUCTION_HOST" bash -s -- \
            "$RUNTIME_ROOT" "$RUNTIME_ENV_FILE" "$RUNTIME_SECRETS_ROOT" "$EXPECTED_API_PORT" \
            < scripts/runtime-path-inventory.sh > runtime-before-production.txt
          awk '
            /^BEGIN_CONTRACT$/ { capture=1; next }
            /^END_CONTRACT$/ { capture=0 }
            capture { print }
          ' runtime-before-production.txt | LC_ALL=C sort > runtime-before-production.contract
          actual="$(sha256sum runtime-before-production.contract | awk '{print $1}')"
          [[ "$actual" == "$RUNTIME_FINGERPRINT" ]]
          grep -qx 'ready_for_write_disabled_deploy=true' runtime-before-production.contract

      - name: Upload reviewed production package after path verification
        shell: bash
        run: |
          set -euo pipefail
          archive="/tmp/scrapper-production-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tgz"
          tar -czf "$archive" docker-compose.yml
          sha256sum "$archive" > "$archive.sha256"
          ssh_options=(
            -i "$HOME/.ssh/id_ed25519"
            -p "$PRODUCTION_SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          scp_options=(
            -i "$HOME/.ssh/id_ed25519"
            -P "$PRODUCTION_SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          printf '%s' "$PRODUCTION_GHCR_READ_TOKEN" | \
            ssh "${ssh_options[@]}" "$PRODUCTION_USER@$PRODUCTION_HOST" \
              "docker login ghcr.io -u '$PRODUCTION_GHCR_USER' --password-stdin"
          scp "${scp_options[@]}" "$archive" "$archive.sha256" \
            "$PRODUCTION_USER@$PRODUCTION_HOST:/tmp/"

      - name: Deploy approved immutable image with external delivery disabled
        shell: bash
        run: |
          set -euo pipefail
          remote_archive="/tmp/scrapper-production-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tgz"
          ssh_options=(
            -i "$HOME/.ssh/id_ed25519"
            -p "$PRODUCTION_SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          ssh "${ssh_options[@]}" "$PRODUCTION_USER@$PRODUCTION_HOST" bash -s -- \
            "$RUNTIME_ROOT" "$RUNTIME_ENV_FILE" "$RUNTIME_SECRETS_ROOT" \
            "$EXPECTED_API_PORT" "$RELEASE_SHA" "$IMAGE" "$remote_archive" <<'REMOTE'
          set -euo pipefail
          root="$1"
          env_file="$2"
          secrets_root="$3"
          api_port="$4"
          release_sha="$5"
          image="$6"
          archive="$7"

          [[ -d "$root" && ! -L "$root" ]]
          [[ -f "$env_file" && ! -L "$env_file" ]]
          [[ -d "$secrets_root" && ! -L "$secrets_root" ]]
          grep -Eq '^[[:space:]]*ENABLE_EXTERNAL_DELIVERY[[:space:]]*=[[:space:]]*false[[:space:]]*$' "$env_file"
          grep -Eq '^[[:space:]]*ENABLE_REGISTRY_ENRICHMENT[[:space:]]*=[[:space:]]*false[[:space:]]*$' "$env_file"
          (cd /tmp && sha256sum -c "$(basename "$archive").sha256")
          if tar -tzf "$archive" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "ERROR=UNSAFE_ARCHIVE_PATH" >&2
            exit 1
          fi

          release_dir="$root/releases/$release_sha"
          install -d -m 0750 "$root/releases" "$root/backups" "$release_dir"
          tar -xzf "$archive" --no-same-owner --no-same-permissions -C "$release_dir"
          cd "$release_dir"
          printf '%s\n' "$release_sha" > .source_sha
          sha256sum "$archive" | awk '{print $1}' > .package_sha256

          export SCRAPPER_IMAGE="$image"
          export ENABLE_EXTERNAL_DELIVERY=false
          export ENABLE_REGISTRY_ENRICHMENT=false
          compose=(docker compose --env-file "$env_file" -f docker-compose.yml)
          "${compose[@]}" config --quiet
          "${compose[@]}" pull
          "${compose[@]}" up -d postgres redis
          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          "${compose[@]}" exec -T postgres pg_dump -U scrapper -d scrapper -Fc \
            > "$root/backups/predeploy-$timestamp.dump"
          "${compose[@]}" run --rm migrate
          "${compose[@]}" up -d --no-deps api crawl-worker delivery-worker

          ready=false
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 5 "http://127.0.0.1:$api_port/readyz" >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != "true" ]]; then
            previous=""
            [[ -f "$root/.current_image" ]] && previous="$(cat "$root/.current_image")"
            "${compose[@]}" stop api crawl-worker delivery-worker || true
            if [[ "$previous" =~ @sha256:[a-f0-9]{64}$ ]]; then
              export SCRAPPER_IMAGE="$previous"
              "${compose[@]}" up -d --no-deps api crawl-worker delivery-worker || true
            fi
            exit 1
          fi

          install -d -m 0750 release-evidence
          "${compose[@]}" ps > release-evidence/compose-ps.txt
          printf '%s\n' "$image" > release-evidence/image-ref.txt
          printf '%s\n' "$release_sha" > release-evidence/release-sha.txt
          printf '%s\n' "$timestamp" > release-evidence/backup-timestamp.txt
          rm -f "$archive" "$archive.sha256"
          REMOTE

      - name: Run production no-write canary before recording success
        env:
          CANARY_TOKEN: ${{ secrets.PRODUCTION_CANARY_TOKEN }}
          CANARY_TENANT_ID: ${{ secrets.PRODUCTION_CANARY_TENANT_ID }}
          CANARY_API_BASE: ${{ vars.PRODUCTION_API_BASE }}
          CANARY_SEED_URL: ${{ vars.PRODUCTION_CANARY_SEED_URL || 'https://example.com' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p production-evidence
          RELEASE_SHA="$RELEASE_SHA" node scripts/no-write-canary.mjs \
            | tee production-evidence/no-write-canary.json

      - name: Record successful production identity only after canary passes
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(
            -i "$HOME/.ssh/id_ed25519"
            -p "$PRODUCTION_SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          ssh "${ssh_options[@]}" "$PRODUCTION_USER@$PRODUCTION_HOST" bash -s -- \
            "$RUNTIME_ROOT" "$RELEASE_SHA" "$IMAGE" <<'REMOTE'
          set -euo pipefail
          root="$1"
          release_sha="$2"
          image="$3"
          previous=""
          [[ -f "$root/.current_image" ]] && previous="$(cat "$root/.current_image")"
          printf '%s\n' "$previous" > "$root/.previous_image"
          printf '%s\n' "$image" > "$root/.current_image"
          printf '%s\n' "$release_sha" > "$root/.current_release"
          REMOTE
          cat > production-evidence/production-deployment.json <<EOF
          {
            "release_sha": "$RELEASE_SHA",
            "image": "$IMAGE",
            "approved_by": "$GITHUB_ACTOR",
            "runtime_fingerprint": "$RUNTIME_FINGERPRINT",
            "external_delivery_enabled": false,
            "registry_enrichment_enabled": false,
            "deployed": true
          }
          EOF

      - name: Collect evidence and remove registry credentials
        if: always()
        shell: bash
        run: |
          ssh_options=(
            -i "$HOME/.ssh/id_ed25519"
            -p "$PRODUCTION_SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          scp_options=(
            -i "$HOME/.ssh/id_ed25519"
            -P "$PRODUCTION_SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          remote_evidence="/tmp/scrapper-production-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tgz"
          ssh "${ssh_options[@]}" "$PRODUCTION_USER@$PRODUCTION_HOST" bash -s -- \
            "$RUNTIME_ROOT" "$RELEASE_SHA" "$remote_evidence" <<'REMOTE' || true
          set -euo pipefail
          root="$1"
          release_sha="$2"
          destination="$3"
          cd "$root/releases/$release_sha"
          tar -czf "$destination" release-evidence
          REMOTE
          scp "${scp_options[@]}" "$PRODUCTION_USER@$PRODUCTION_HOST:$remote_evidence" ./ || true
          ssh "${ssh_options[@]}" "$PRODUCTION_USER@$PRODUCTION_HOST" \
            "rm -f '$remote_evidence'; docker logout ghcr.io >/dev/null 2>&1 || true" || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: production-deployment-evidence-${{ inputs.release_sha }}
          path: |
            production-evidence/
            scrapper-production-evidence-*.tgz
            runtime-before-production.txt
            runtime-before-production.contract
          if-no-files-found: warn
          retention-days: 90
