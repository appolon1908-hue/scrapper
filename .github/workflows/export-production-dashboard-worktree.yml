name: Export production dashboard worktree

on:
  push:
    branches:
      - feature/operations-dashboard-production-v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-production-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Export exact tracked source
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > SOURCE_SHA
          git rev-parse 'HEAD^{tree}' > SOURCE_TREE
          git archive --format=tar.gz --output=production-dashboard-worktree.tgz HEAD
          sha256sum production-dashboard-worktree.tgz > SHA256SUMS

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-dashboard-worktree-${{ github.sha }}
          path: |
            production-dashboard-worktree.tgz
            SOURCE_SHA
            SOURCE_TREE
            SHA256SUMS
          if-no-files-found: error
          retention-days: 1
