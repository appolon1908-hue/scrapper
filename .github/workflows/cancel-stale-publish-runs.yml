name: Keep only latest release image run

on:
  push:
    branches:
      - 'release/**'

permissions:
  actions: write
  contents: read

jobs:
  cancel-stale:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Cancel older queued or running image publications
        shell: bash
        run: |
          response="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/publish-image.yml/runs" \
            -f branch="${GITHUB_REF_NAME}" -f per_page=100)"
          keep_id="$(jq -r '.workflow_runs[0].id // empty' <<<"$response")"
          jq -r --arg keep "$keep_id" \
            '.workflow_runs[] | select((.status == "queued" or .status == "in_progress") and (.id|tostring) != $keep) | .id' \
            <<<"$response" | while read -r run_id; do
              [[ -n "$run_id" ]] || continue
              gh api --method POST \
                -H 'Accept: application/vnd.github+json' \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
            done
