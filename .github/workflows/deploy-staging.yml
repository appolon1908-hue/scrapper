name: '[BLOCKED] Legacy Scrapper staging deployment'

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: Immutable GHCR scraper image ending in @sha256:<digest>
        required: true
        type: string
      release_sha:
        description: Exact current SHA of the protected release branch
        required: true
        type: string
      previous_image_ref:
        description: Previously approved immutable scraper image for rollback
        required: true
        type: string
      runtime_root:
        description: Existing verified staging runtime root
        required: true
        type: string
      runtime_env_file:
        description: Existing externally managed staging environment file
        required: true
        type: string
      runtime_secrets_root:
        description: Existing staging secrets directory
        required: true
        type: string
      runtime_fingerprint:
        description: SHA-256 fingerprint from Runtime path inventory
        required: true
        type: string
      expected_api_port:
        description: Expected loopback API port
        required: true
        default: '3200'
        type: string
      approval:
        description: Enter DEPLOY-STAGING <release_sha> <image_ref> <previous_image_ref> <runtime_fingerprint>
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_BRANCH: release/legacy-lineage-disabled

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  authority_gate:
    name: blocked-by-canonical-repository-decision
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse deployment from the legacy lineage
        shell: bash
        run: |
          echo 'appolon1908-hue/scrapper is preserved migration evidence and is not a deployment authority.' >&2
          echo 'Run the reviewed deployment mission from appolon1908-hue/kyqra-crawler.' >&2
          exit 1

  verify_artifact:
    name: verify-artifact
    needs: authority_gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
      attestations: read
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE_REF: ${{ inputs.image_ref }}
      PREVIOUS_IMAGE_REF: ${{ inputs.previous_image_ref }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      RUNTIME_FINGERPRINT: ${{ inputs.runtime_fingerprint }}
      APPROVAL: ${{ inputs.approval }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable digest-bound inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$RUNTIME_FINGERPRINT" =~ ^[a-f0-9]{64}$ ]]
          [[ "$IMAGE_REF" =~ ^ghcr\.io/appolon1908-hue/scrapper@sha256:[a-f0-9]{64}$ ]]
          [[ "$PREVIOUS_IMAGE_REF" =~ ^ghcr\.io/appolon1908-hue/scrapper@sha256:[a-f0-9]{64}$ ]]
          [[ "$IMAGE_REF" != "$PREVIOUS_IMAGE_REF" ]]
          [[ "$APPROVAL" == "DEPLOY-STAGING $RELEASE_SHA $IMAGE_REF $PREVIOUS_IMAGE_REF $RUNTIME_FINGERPRINT" ]]
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]

      - name: Require exact protected release head and exact-SHA checks
        shell: bash
        run: bash scripts/verify-release-context.sh

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify candidate signature provenance and exact revision
        env:
          IMAGE_RELATIONSHIP: exact
        shell: bash
        run: bash scripts/verify-release-image.sh "$IMAGE_REF" "$IMAGE_RELATIONSHIP"

      - name: Verify rollback signature provenance and release ancestry
        env:
          IMAGE_RELATIONSHIP: ancestor
        shell: bash
        run: bash scripts/verify-release-image.sh "$PREVIOUS_IMAGE_REF" "$IMAGE_RELATIONSHIP"

  runtime_preflight:
    name: runtime-preflight
    needs: verify_artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging-runtime-audit
    env:
      RUNTIME_HOST: ${{ secrets.RUNTIME_AUDIT_HOST }}
      RUNTIME_USER: ${{ secrets.RUNTIME_AUDIT_USER }}
      RUNTIME_SSH_KEY: ${{ secrets.RUNTIME_AUDIT_SSH_KEY }}
      RUNTIME_KNOWN_HOSTS: ${{ secrets.RUNTIME_AUDIT_KNOWN_HOSTS }}
      RUNTIME_SSH_PORT: ${{ vars.RUNTIME_AUDIT_SSH_PORT || '22' }}
      RUNTIME_ROOT: ${{ inputs.runtime_root }}
      RUNTIME_ENV_FILE: ${{ inputs.runtime_env_file }}
      RUNTIME_SECRETS_ROOT: ${{ inputs.runtime_secrets_root }}
      RUNTIME_FINGERPRINT: ${{ inputs.runtime_fingerprint }}
      EXPECTED_API_PORT: ${{ inputs.expected_api_port }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Configure read-only SSH identity and pinned host keys
        shell: bash
        run: |
          set -euo pipefail
          for value in RUNTIME_HOST RUNTIME_USER RUNTIME_SSH_KEY RUNTIME_KNOWN_HOSTS; do
            [[ -n "${!value:-}" ]] || { echo "ERROR=MISSING_${value}" >&2; exit 1; }
          done
          [[ "$RUNTIME_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$RUNTIME_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$RUNTIME_SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          for path in "$RUNTIME_ROOT" "$RUNTIME_ENV_FILE" "$RUNTIME_SECRETS_ROOT"; do
            [[ "$path" =~ ^/[A-Za-z0-9._/-]+$ ]]
            [[ "$path" != "/" && "$path" != *"//"* && "$path" != *"/../"* &&
               "$path" != *"/./"* && "$path" != */.. && "$path" != */. ]]
          done
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$RUNTIME_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$RUNTIME_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Verify reviewed fingerprint without changing the server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence
          ssh_options=(-i "$HOME/.ssh/id_ed25519" -p "$RUNTIME_SSH_PORT" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          ssh "${ssh_options[@]}" "$RUNTIME_USER@$RUNTIME_HOST" bash -s -- \
            "$RUNTIME_ROOT" "$RUNTIME_ENV_FILE" "$RUNTIME_SECRETS_ROOT" "$EXPECTED_API_PORT" \
            < scripts/runtime-path-inventory.sh | tee runtime-evidence/preflight-observation.txt
          awk '/^BEGIN_CONTRACT$/ {capture=1; next} /^END_CONTRACT$/ {capture=0} capture {print}' \
            runtime-evidence/preflight-observation.txt | LC_ALL=C sort > runtime-evidence/preflight-contract.txt
          actual="$(sha256sum runtime-evidence/preflight-contract.txt | awk '{print $1}')"
          [[ "$actual" == "$RUNTIME_FINGERPRINT" ]]
          grep -qx 'ready_for_write_disabled_deploy=true' runtime-evidence/preflight-contract.txt
          printf '%s\n' "$actual" > runtime-evidence/verified-fingerprint.txt
          printf '%s\n' 'server_modified=false' > runtime-evidence/preflight-result.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-runtime-preflight-${{ inputs.runtime_fingerprint }}
          path: runtime-evidence/
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: deploy
    needs: [verify_artifact, runtime_preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: staging
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
      STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT || '22' }}
      STAGING_GHCR_USER: ${{ secrets.STAGING_GHCR_USER }}
      STAGING_GHCR_READ_TOKEN: ${{ secrets.STAGING_GHCR_READ_TOKEN }}
      RUNTIME_ROOT: ${{ inputs.runtime_root }}
      RUNTIME_ENV_FILE: ${{ inputs.runtime_env_file }}
      RUNTIME_SECRETS_ROOT: ${{ inputs.runtime_secrets_root }}
      RUNTIME_FINGERPRINT: ${{ inputs.runtime_fingerprint }}
      EXPECTED_API_PORT: ${{ inputs.expected_api_port }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      IMAGE_REF: ${{ inputs.image_ref }}
      PREVIOUS_IMAGE_REF: ${{ inputs.previous_image_ref }}
      CANARY_TOKEN: ${{ secrets.STAGING_CANARY_TOKEN }}
      CANARY_TENANT_ID: ${{ secrets.STAGING_CANARY_TENANT_ID }}
      CANARY_API_BASE: ${{ vars.STAGING_CANARY_API_BASE }}
      CANARY_SEED_URL: ${{ vars.STAGING_CANARY_SEED_URL || 'https://example.com' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.16.0'

      - name: Validate deployment credentials and paths
        shell: bash
        run: |
          set -euo pipefail
          for value in STAGING_HOST STAGING_USER STAGING_SSH_KEY STAGING_KNOWN_HOSTS STAGING_GHCR_USER STAGING_GHCR_READ_TOKEN CANARY_TOKEN CANARY_TENANT_ID CANARY_API_BASE; do
            [[ -n "${!value:-}" ]] || { echo "ERROR=MISSING_${value}" >&2; exit 1; }
          done
          [[ "$STAGING_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$STAGING_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$STAGING_GHCR_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$STAGING_SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          for path in "$RUNTIME_ROOT" "$RUNTIME_ENV_FILE" "$RUNTIME_SECRETS_ROOT"; do
            [[ "$path" =~ ^/[A-Za-z0-9._/-]+$ ]]
            [[ "$path" != "/" && "$path" != *"//"* && "$path" != *"/../"* &&
               "$path" != *"/./"* && "$path" != */.. && "$path" != */. ]]
          done

      - name: Configure deployment SSH identity and pinned host keys
        shell: bash
        run: |
          set -euo pipefail
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Reverify fingerprint before the first server write
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(-i "$HOME/.ssh/id_ed25519" -p "$STAGING_SSH_PORT" -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          ssh "${ssh_options[@]}" "$STAGING_USER@$STAGING_HOST" bash -s -- \
            "$RUNTIME_ROOT" "$RUNTIME_ENV_FILE" "$RUNTIME_SECRETS_ROOT" "$EXPECTED_API_PORT" \
            < scripts/runtime-path-inventory.sh > runtime-before-deploy.txt
          awk '/^BEGIN_CONTRACT$/ {capture=1; next} /^END_CONTRACT$/ {capture=0} capture {print}' \
            runtime-before-deploy.txt | LC_ALL=C sort > runtime-before-deploy.contract
          actual="$(sha256sum runtime-before-deploy.contract | awk '{print $1}')"
          [[ "$actual" == "$RUNTIME_FINGERPRINT" ]]
          grep -qx 'ready_for_write_disabled_deploy=true' runtime-before-deploy.contract

      - name: Upload and extract the reviewed package
        shell: bash
        run: |
          set -euo pipefail
          archive="/tmp/scrapper-staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tgz"
          tar -czf "$archive" docker-compose.yml deploy scripts/deploy-staging.sh scripts/rollback-staging.sh
          sha256sum "$archive" > "$archive.sha256"
          ssh_options=(-i "$HOME/.ssh/id_ed25519" -p "$STAGING_SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          scp_options=(-i "$HOME/.ssh/id_ed25519" -P "$STAGING_SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          scp "${scp_options[@]}" "$archive" "$archive.sha256" "$STAGING_USER@$STAGING_HOST:/tmp/"
          ssh "${ssh_options[@]}" "$STAGING_USER@$STAGING_HOST" bash -s -- \
            "$RUNTIME_ROOT" "$RELEASE_SHA" "$archive" <<'REMOTE'
          set -euo pipefail
          root="$1"; release_sha="$2"; archive="$3"
          (cd /tmp && sha256sum -c "$(basename "$archive").sha256")
          if tar -tzf "$archive" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then exit 1; fi
          release_dir="$root/releases/$release_sha"
          install -d -m 0750 "$root/releases" "$release_dir"
          tar -xzf "$archive" --no-same-owner --no-same-permissions -C "$release_dir"
          printf '%s\n' "$release_sha" > "$release_dir/.source_sha"
          REMOTE

      - name: Deploy candidate with run-scoped registry credentials
        id: candidate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(-i "$HOME/.ssh/id_ed25519" -p "$STAGING_SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          docker_config="/tmp/scrapper-docker-auth-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-candidate"
          printf '%s' "$STAGING_GHCR_READ_TOKEN" | ssh "${ssh_options[@]}" "$STAGING_USER@$STAGING_HOST" \
            "set -euo pipefail; docker_config='$docker_config'; cleanup(){ DOCKER_CONFIG=\"\$docker_config\" docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf \"\$docker_config\"; }; trap cleanup EXIT; install -d -m 0700 \"\$docker_config\"; DOCKER_CONFIG=\"\$docker_config\" docker login ghcr.io -u '$STAGING_GHCR_USER' --password-stdin >/dev/null; export DOCKER_CONFIG=\"\$docker_config\"; cd '$RUNTIME_ROOT/releases/$RELEASE_SHA'; CANDIDATE_SCRAPPER_IMAGE='$IMAGE_REF' DEPLOY_ENV_FILE='$RUNTIME_ENV_FILE' EVIDENCE_DIR='release-evidence/staging' READINESS_URL='http://127.0.0.1:$EXPECTED_API_PORT/readyz' RELEASE_SHA='$RELEASE_SHA' bash scripts/deploy-staging.sh"

      - name: Run candidate no-write canary
        id: candidate_canary
        if: steps.candidate.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p runner-evidence/candidate
          RELEASE_SHA="$RELEASE_SHA" node scripts/no-write-canary.mjs | tee runner-evidence/candidate/no-write-canary.json

      - name: Exercise rollback to the verified previous image
        id: rollback
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(-i "$HOME/.ssh/id_ed25519" -p "$STAGING_SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          docker_config="/tmp/scrapper-docker-auth-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-rollback"
          printf '%s' "$STAGING_GHCR_READ_TOKEN" | ssh "${ssh_options[@]}" "$STAGING_USER@$STAGING_HOST" \
            "set -euo pipefail; docker_config='$docker_config'; cleanup(){ DOCKER_CONFIG=\"\$docker_config\" docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf \"\$docker_config\"; }; trap cleanup EXIT; install -d -m 0700 \"\$docker_config\"; DOCKER_CONFIG=\"\$docker_config\" docker login ghcr.io -u '$STAGING_GHCR_USER' --password-stdin >/dev/null; export DOCKER_CONFIG=\"\$docker_config\"; cd '$RUNTIME_ROOT/releases/$RELEASE_SHA'; PREVIOUS_SCRAPPER_IMAGE='$PREVIOUS_IMAGE_REF' DEPLOY_ENV_FILE='$RUNTIME_ENV_FILE' EVIDENCE_DIR='release-evidence/rollback' READINESS_URL='http://127.0.0.1:$EXPECTED_API_PORT/readyz' bash scripts/rollback-staging.sh"

      - name: Run rollback no-write canary
        id: rollback_canary
        if: steps.rollback.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p runner-evidence/rollback
          RELEASE_SHA="rollback-$RELEASE_SHA" node scripts/no-write-canary.mjs | tee runner-evidence/rollback/no-write-canary.json

      - name: Restore candidate after successful rehearsal
        id: restore
        if: always() && steps.candidate.outcome == 'success' && steps.candidate_canary.outcome == 'success' && steps.rollback.outcome == 'success' && steps.rollback_canary.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(-i "$HOME/.ssh/id_ed25519" -p "$STAGING_SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          docker_config="/tmp/scrapper-docker-auth-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-restore"
          printf '%s' "$STAGING_GHCR_READ_TOKEN" | ssh "${ssh_options[@]}" "$STAGING_USER@$STAGING_HOST" \
            "set -euo pipefail; docker_config='$docker_config'; cleanup(){ DOCKER_CONFIG=\"\$docker_config\" docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf \"\$docker_config\"; }; trap cleanup EXIT; install -d -m 0700 \"\$docker_config\"; DOCKER_CONFIG=\"\$docker_config\" docker login ghcr.io -u '$STAGING_GHCR_USER' --password-stdin >/dev/null; export DOCKER_CONFIG=\"\$docker_config\"; cd '$RUNTIME_ROOT/releases/$RELEASE_SHA'; CANDIDATE_SCRAPPER_IMAGE='$IMAGE_REF' DEPLOY_ENV_FILE='$RUNTIME_ENV_FILE' EVIDENCE_DIR='release-evidence/restored-candidate' READINESS_URL='http://127.0.0.1:$EXPECTED_API_PORT/readyz' RELEASE_SHA='$RELEASE_SHA' bash scripts/deploy-staging.sh"

      - name: Run restored candidate no-write canary
        id: restored_canary
        if: steps.restore.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p runner-evidence/restored-candidate
          RELEASE_SHA="$RELEASE_SHA" node scripts/no-write-canary.mjs | tee runner-evidence/restored-candidate/no-write-canary.json

      - name: Restore previous image if any candidate gate failed
        id: safety_rollback
        if: always() && (steps.candidate.outcome != 'success' || steps.candidate_canary.outcome != 'success' || steps.rollback.outcome != 'success' || steps.rollback_canary.outcome != 'success' || steps.restore.outcome != 'success' || steps.restored_canary.outcome != 'success')
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(-i "$HOME/.ssh/id_ed25519" -p "$STAGING_SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          docker_config="/tmp/scrapper-docker-auth-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-safety"
          printf '%s' "$STAGING_GHCR_READ_TOKEN" | ssh "${ssh_options[@]}" "$STAGING_USER@$STAGING_HOST" \
            "set -euo pipefail; docker_config='$docker_config'; cleanup(){ DOCKER_CONFIG=\"\$docker_config\" docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf \"\$docker_config\"; }; trap cleanup EXIT; install -d -m 0700 \"\$docker_config\"; DOCKER_CONFIG=\"\$docker_config\" docker login ghcr.io -u '$STAGING_GHCR_USER' --password-stdin >/dev/null; export DOCKER_CONFIG=\"\$docker_config\"; cd '$RUNTIME_ROOT/releases/$RELEASE_SHA'; PREVIOUS_SCRAPPER_IMAGE='$PREVIOUS_IMAGE_REF' DEPLOY_ENV_FILE='$RUNTIME_ENV_FILE' EVIDENCE_DIR='release-evidence/safety-rollback' READINESS_URL='http://127.0.0.1:$EXPECTED_API_PORT/readyz' bash scripts/rollback-staging.sh"

      - name: Record candidate identity only after every gate passes
        if: steps.candidate.outcome == 'success' && steps.candidate_canary.outcome == 'success' && steps.rollback.outcome == 'success' && steps.rollback_canary.outcome == 'success' && steps.restore.outcome == 'success' && steps.restored_canary.outcome == 'success'
        shell: bash
        run: |
          ssh_options=(-i "$HOME/.ssh/id_ed25519" -p "$STAGING_SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          ssh "${ssh_options[@]}" "$STAGING_USER@$STAGING_HOST" \
            "printf '%s\n' '$PREVIOUS_IMAGE_REF' > '$RUNTIME_ROOT/.previous_image'; printf '%s\n' '$IMAGE_REF' > '$RUNTIME_ROOT/.current_image'; printf '%s\n' '$RELEASE_SHA' > '$RUNTIME_ROOT/.current_release'"

      - name: Collect evidence and remove temporary files
        if: always()
        shell: bash
        run: |
          archive="/tmp/scrapper-staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tgz"
          ssh_options=(-i "$HOME/.ssh/id_ed25519" -p "$STAGING_SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          scp_options=(-i "$HOME/.ssh/id_ed25519" -P "$STAGING_SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          remote_evidence="/tmp/scrapper-staging-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tgz"
          ssh "${ssh_options[@]}" "$STAGING_USER@$STAGING_HOST" \
            "cd '$RUNTIME_ROOT/releases/$RELEASE_SHA' && tar -czf '$remote_evidence' release-evidence; find /tmp -maxdepth 1 -type d -name 'scrapper-docker-auth-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-*' -exec rm -rf -- {} +; rm -f '$archive' '$archive.sha256'" || true
          scp "${scp_options[@]}" "$STAGING_USER@$STAGING_HOST:$remote_evidence" ./ || true
          ssh "${ssh_options[@]}" "$STAGING_USER@$STAGING_HOST" "rm -f '$remote_evidence'" || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: staging-deployment-evidence-${{ inputs.release_sha }}
          path: |
            runner-evidence/
            scrapper-staging-evidence-*.tgz
            runtime-before-deploy.txt
            runtime-before-deploy.contract
          if-no-files-found: warn
          retention-days: 30

      - name: fail-after-rollback
        if: always() && (steps.candidate.outcome != 'success' || steps.candidate_canary.outcome != 'success' || steps.rollback.outcome != 'success' || steps.rollback_canary.outcome != 'success' || steps.restore.outcome != 'success' || steps.restored_canary.outcome != 'success')
        shell: bash
        run: |
          if [[ "${{ steps.safety_rollback.outcome }}" == "success" ]]; then
            echo 'A staging gate failed; the verified previous image was restored and the candidate was not recorded.' >&2
          else
            echo 'A staging gate failed and the safety rollback did not complete successfully.' >&2
          fi
          exit 1
