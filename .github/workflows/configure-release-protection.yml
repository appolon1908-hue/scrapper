name: Configure release branch protection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.RELEASE_ADMIN_TOKEN }}
      RELEASE_BRANCH: release/production-readiness-20260826
    steps:
      - name: Require repository administration token
        run: |
          if [[ -z "${GH_TOKEN}" ]]; then
            echo 'RELEASE_ADMIN_TOKEN is not configured.' >&2
            echo 'The token must have repository administration permission and must be stored as an Actions secret.' >&2
            exit 1
          fi

      - name: Apply protected release policy
        run: |
          encoded_branch="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["RELEASE_BRANCH"], safe=""))')"
          cat > /tmp/protection.json <<'JSON'
          {
            "required_status_checks": {
              "strict": true,
              "contexts": ["validate"]
            },
            "enforce_admins": true,
            "required_pull_request_reviews": {
              "dismiss_stale_reviews": true,
              "require_code_owner_reviews": false,
              "required_approving_review_count": 1,
              "require_last_push_approval": true,
              "bypass_pull_request_allowances": {
                "users": [],
                "teams": [],
                "apps": []
              }
            },
            "restrictions": null,
            "required_linear_history": true,
            "allow_force_pushes": false,
            "allow_deletions": false,
            "block_creations": false,
            "required_conversation_resolution": true,
            "lock_branch": false,
            "allow_fork_syncing": false
          }
          JSON
          gh api \
            --method PUT \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/branches/${encoded_branch}/protection" \
            --input /tmp/protection.json

      - name: Verify protection is active
        run: |
          encoded_branch="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["RELEASE_BRANCH"], safe=""))')"
          protected="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${encoded_branch}" --jq '.protected')"
          [[ "${protected}" == 'true' ]]
