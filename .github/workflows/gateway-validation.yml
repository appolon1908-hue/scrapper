name: Gateway security validation

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'
      - 'feature/**'
      - 'integration/**'
      - 'hardening/**'
      - 'refactor/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    name: gateway
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Kong and Caddy security controls
        shell: bash
        run: bash scripts/validate-gateway.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gateway-evidence-${{ github.sha }}
          path: release-evidence
          if-no-files-found: warn
          retention-days: 30
