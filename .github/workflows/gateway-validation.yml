name: Gateway security validation

on:
  pull_request:
    branches:
      - 'release/**'
  push:
    branches:
      - 'release/**'
      - 'hardening/**'
    paths:
      - 'deploy/**'
      - 'scripts/validate-gateway.sh'
      - 'test/fixtures/Caddyfile.gateway-test'
      - '.github/workflows/gateway-validation.yml'

permissions:
  contents: read

concurrency:
  group: gateway-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    name: gateway
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Kong and Caddy security controls
        env:
          KONG_TEST_IMAGE: kong:3.9
          CADDY_TEST_IMAGE: caddy:2-alpine
          CURL_TEST_IMAGE: curlimages/curl:8.12.1
        run: bash scripts/validate-gateway.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: gateway-validation-${{ github.sha }}
          path: release-evidence/
          if-no-files-found: warn
          retention-days: 14
