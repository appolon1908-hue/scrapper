name: Export turnkey worktree

on:
  push:
    branches:
      - feature/turnkey-kong-control-plane-v1

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Create exact source archive
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > SOURCE_SHA
          git status --short > SOURCE_STATUS
          git archive --format=tar.gz --output=turnkey-worktree.tgz HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: turnkey-worktree-${{ github.sha }}
          path: |
            turnkey-worktree.tgz
            SOURCE_SHA
            SOURCE_STATUS
          if-no-files-found: error
          retention-days: 1
