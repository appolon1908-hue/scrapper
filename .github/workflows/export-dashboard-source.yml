name: Export operations dashboard source

on:
  push:
    branches:
      - feature/operations-dashboard

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create review archive
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > DASHBOARD_SOURCE_SHA
          tar -czf operations-dashboard-source.tgz \
            apps/operations-dashboard \
            docs/design/OPERATIONS_DASHBOARD.md \
            openapi/openapi.yaml \
            package.json \
            package-lock.json \
            test

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: operations-dashboard-source-${{ github.sha }}
          path: |
            operations-dashboard-source.tgz
            DASHBOARD_SOURCE_SHA
          if-no-files-found: error
          retention-days: 1
