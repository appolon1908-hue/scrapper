name: Export turnkey dashboard worktree

on:
  push:
    branches:
      - feature/turnkey-control-plane-dashboard-v1

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Create exact source archive
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > SOURCE_SHA
          git status --short > SOURCE_STATUS
          git archive --format=tar.gz --output=dashboard-worktree.tgz HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: turnkey-dashboard-worktree-${{ github.sha }}
          path: |
            dashboard-worktree.tgz
            SOURCE_SHA
            SOURCE_STATUS
          if-no-files-found: error
          retention-days: 1
