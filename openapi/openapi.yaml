        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationHeader'
        - $ref: '#/components/parameters/IdempotencyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrawlJobRequest'
      responses:
        '200':
          description: Existing idempotent job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCreateResponse'
        '202':
          description: New job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags:
        - Jobs
      operationId: listCrawlJobs
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
