openapi: 3.1.0
info:
  title: Codestra Business Scrapper API
  version: 2.1.0
  description: 'Multi-tenant business website crawl and CRM-enrichment control plane.

    The OpenAPI document describes the implemented API surface only. It does

    not claim that the service has been deployed to production.

    '
servers:
  - url: /
tags:
  - name: System
  - name: Jobs
  - name: Operations
security:
  - bearerAuth: []
paths:
  /:
    get:
      tags:
        - System
      security: []
      operationId: serviceInfo
      responses:
        '200':
          description: Service metadata
          content:
            application/json:
              schema:
                type: object
                required:
                  - service
                  - version
                  - api
                  - documentation
                  - deployment_status
                properties:
                  service:
                    type: string
                  version:
                    type: string
                  api:
                    type: string
                  documentation:
                    type: string
                  deployment_status:
                    type: string
  /healthz:
    get:
      tags:
        - System
      security: []
      operationId: liveness
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /readyz:
    get:
      tags:
        - System
      security: []
      operationId: readiness
      responses:
        '200':
          description: Dependencies are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: A dependency is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /openapi.yaml:
    get:
      tags:
        - System
      security: []
      operationId: openApiDocument
      responses:
        '200':
          description: OpenAPI contract
          content:
            application/yaml:
              schema:
                type: string
