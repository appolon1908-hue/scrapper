            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 500
      responses:
        '200':
          description: Tenant jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPage'
        '400':
