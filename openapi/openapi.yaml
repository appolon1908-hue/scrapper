components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    TenantHeader:
      name: x-tenant-id
      in: header
      required: false
      description: Must match the authenticated service principal when supplied.
      schema:
        type: string
        maxLength: 200
    CorrelationHeader:
      name: x-correlation-id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    IdempotencyHeader:
      name: idempotency-key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    JobId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Required scope is missing
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Request conflicts with current state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        request_id:
          type: string
        required_scope:
          type: string
        details: {}
    JobStatus:
      type: string
      enum:
        - queued
        - running
        - completed
        - failed
        - cancel_requested
        - cancelled
    CrawlJobRequest:
      type: object
      required:
        - seedUrls
      additionalProperties: false
      properties:
        seedUrls:
          type: array
          minItems: 1
          maxItems: 5000
          items:
            type: string
            format: uri
        profile:
          type: string
          enum:
            - company
            - contacts
            - registry
            - full
          default: full
        mode:
          type: string
          enum:
            - single
            - domain
            - list
            - discovery
          default: domain
        browser:
          type: string
          enum:
            - auto
            - http
            - playwright
          default: auto
        maxPages:
          type: integer
          minimum: 1
          maximum: 50000
          default: 250
        maxCompanies:
          type: integer
          minimum: 1
          maximum: 5000
          default: 500
        maxDepth:
          type: integer
          minimum: 0
          maximum: 8
          default: 3
        requestsPerSecond:
          type: number
          minimum: 0.1
          maximum: 10
          default: 1
        includePatterns:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 300
          default: []
        excludePatterns:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 300
          default: []
        countryCode:
          type: string
          pattern: ^[A-Z]{2}$
          default: US
        callbackReference:
          type: string
          maxLength: 200
        tags:
          type: object
          additionalProperties:
            type: string
            maxLength: 500
          default: {}
        verification:
          type: object
          additionalProperties: false
          properties:
            knownEin:
              type: string
              pattern: ^\d{2}-?\d{7}$
            provider:
              type: string
              maxLength: 100
            consentReference:
              type: string
              maxLength: 200
    CrawlJobPublicRequest:
      type: object
      description:
        Safe request summary returned to authorized operators. Sensitive verification input is always
        omitted.
      required:
        - seedUrls
      additionalProperties: false
      properties:
        seedUrls:
          type: array
          minItems: 1
          maxItems: 5000
          items:
            type: string
            format: uri
        profile:
          type: string
          enum:
            - company
            - contacts
            - registry
            - full
        mode:
          type: string
          enum:
            - single
            - domain
            - list
            - discovery
        browser:
          type: string
          enum:
            - auto
            - http
            - playwright
        maxPages:
          type: integer
          minimum: 1
          maximum: 50000
        maxCompanies:
          type: integer
          minimum: 1
          maximum: 5000
        maxDepth:
          type: integer
