services:
  api:
    environment:
      ENABLE_EXTERNAL_DELIVERY: 'false'
      ENABLE_REGISTRY_ENRICHMENT: 'false'
      JOB_LEASE_SECONDS: '${JOB_LEASE_SECONDS:-120}'
      JOB_HEARTBEAT_SECONDS: '${JOB_HEARTBEAT_SECONDS:-20}'
      OUTBOX_LEASE_SECONDS: '${OUTBOX_LEASE_SECONDS:-600}'

  crawl-worker:
    environment:
      ENABLE_EXTERNAL_DELIVERY: 'false'
      ENABLE_REGISTRY_ENRICHMENT: 'false'
      JOB_LEASE_SECONDS: '${JOB_LEASE_SECONDS:-120}'
      JOB_HEARTBEAT_SECONDS: '${JOB_HEARTBEAT_SECONDS:-20}'
      OUTBOX_LEASE_SECONDS: '${OUTBOX_LEASE_SECONDS:-600}'

  delivery-worker:
    environment:
      ENABLE_EXTERNAL_DELIVERY: 'false'
      ENABLE_REGISTRY_ENRICHMENT: 'false'
      JOB_LEASE_SECONDS: '${JOB_LEASE_SECONDS:-120}'
      JOB_HEARTBEAT_SECONDS: '${JOB_HEARTBEAT_SECONDS:-20}'
      OUTBOX_LEASE_SECONDS: '${OUTBOX_LEASE_SECONDS:-600}'

  kong:
    image: '${KONG_IMAGE:?set an immutable Kong image reference containing @sha256}'
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 'off'
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      KONG_NGINX_WORKER_PROCESSES: '2'
      KONG_LOG_LEVEL: notice
    volumes:
      - ./deploy/kong/kong.yml:/etc/kong/kong.yml:ro
    networks: [ingress, edge]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /usr/local/kong:size=128m,mode=0755
    mem_limit: 1g
    cpus: 2
    healthcheck:
      test: [CMD, kong, health]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  caddy:
    image: '${CADDY_IMAGE:?set an immutable Caddy image reference containing @sha256}'
    environment:
      ACME_EMAIL: '${ACME_EMAIL:?set ACME account email}'
      SCRAPPER_API_DOMAIN: '${SCRAPPER_API_DOMAIN:?set public API hostname}'
      SCRAPPER_INTEGRATION_DOMAIN: '${SCRAPPER_INTEGRATION_DOMAIN:?set mTLS integration hostname}'
      INTEGRATION_ALLOWLIST: '${INTEGRATION_ALLOWLIST:-10.40.0.1/32 127.0.0.1/32}'
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    secrets: [integration_client_ca]
    networks: [edge]
    depends_on:
      kong: { condition: service_healthy }
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=64m,mode=1777]
    mem_limit: 512m
    cpus: 1

networks:
  edge: {}

volumes:
  caddy-data:
  caddy-config:

secrets:
  integration_client_ca:
    file: '${INTEGRATION_CLIENT_CA_FILE:?set trusted integration client CA path}'
